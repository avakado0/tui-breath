[package]
name = "tui_breath"
version = "0.3.4"
edition = "2021"
description = "Terminal breathing guide built with Rust + Ratatui. 6 patterns, breath hold, workout mode, smooth animations, JSON session tracking."
license = "MIT"
homepage = "https://batu0.com"
repository = "https://github.com/avakado0/tui-breath"
keywords = ["breathing", "tui", "terminal", "wellness", "ratatui"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "tui_breath"
path = "src/main.rs"

[dependencies]
ratatui = "0.27"
crossterm = "0.27"
tokio = { version = "1.35", features = ["rt", "time", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
anyhow = "1.0"
ureq = { version = "2", features = ["json"] }
cpal = { version = "0.18", optional = true }

[features]
default = []
audio = ["cpal"]

[profile.release]
opt-level = 3
strip = true
lto = true
