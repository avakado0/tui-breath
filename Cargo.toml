[package]
name = "tui_breath"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tui_breath"
path = "src/main.rs"

[dependencies]
ratatui = "0.27"
crossterm = "0.27"
tokio = { version = "1.35", features = ["rt", "time", "macros"] }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
anyhow = "1.0"
animate = { path = "animate/animate" }

[profile.release]
opt-level = 3
strip = true
lto = true
